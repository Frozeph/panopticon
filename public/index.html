<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGUS v7 — Geospatial Intelligence</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar">
  <div id="tb-left">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 20 20"><polygon points="10,1 19,18 1,18" fill="none" stroke="#f59e0b" stroke-width="1.5"/><circle cx="10" cy="10" r="3" fill="#f59e0b"/><line x1="10" y1="4" x2="10" y2="7" stroke="#f59e0b" stroke-width="1"/><line x1="10" y1="13" x2="10" y2="16" stroke="#f59e0b" stroke-width="1"/><line x1="4" y1="10" x2="7" y2="10" stroke="#f59e0b" stroke-width="1"/><line x1="13" y1="10" x2="16" y2="10" stroke="#f59e0b" stroke-width="1"/></svg>
      <span class="logo-text">ARGUS</span>
      <span class="logo-ver">7.0</span>
    </div>
    <div class="tb-divider"></div>
    <span id="clock" class="mono">--:--:--Z</span>
    <div class="tb-divider"></div>
    <span id="loc-display" class="mono dim small">--°N --°E ALT:---km</span>
  </div>

  <div id="tb-layers">
    <button class="lbtn on" data-layer="satellites">SAT <span class="lbtn-count" id="cnt-sat">0</span></button>
    <button class="lbtn on" data-layer="flights">AIR <span class="lbtn-count" id="cnt-air">0</span></button>
    <button class="lbtn on" data-layer="military">MIL <span class="lbtn-count" id="cnt-mil">0</span></button>
    <button class="lbtn on" data-layer="ships">AIS <span class="lbtn-count" id="cnt-ais">0</span></button>
    <button class="lbtn on" data-layer="quakes">SEIS <span class="lbtn-count" id="cnt-quake">0</span></button>
    <button class="lbtn" data-layer="cctv">CCTV <span class="lbtn-count" id="cnt-cctv">0</span></button>
    <button class="lbtn" data-layer="wildfires">FIRE <span class="lbtn-count" id="cnt-fire">0</span></button>
    <button class="lbtn" data-layer="jamming">JAM</button>
    <button class="lbtn" data-layer="mesh">MESH <span class="lbtn-count" id="cnt-mesh">0</span></button>
    <button class="lbtn on" data-layer="intel">INTEL</button>
  </div>

  <div id="tb-right">
    <div class="status-pill" id="pill-aisstream" title="AISStream WebSocket">
      <span class="dot red"></span>AIS
    </div>
    <div class="status-pill" id="pill-shodan" title="Shodan API">
      <span class="dot red"></span>SDN
    </div>
    <div class="tb-divider"></div>
    <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
    <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
  </div>
</div>

<!-- GLOBE -->
<div id="cesiumContainer"></div>

<!-- LEFT SIDEBAR -->
<div id="sidebar">
  <div class="sb-block">
    <div class="sb-label">VIEW</div>
    <div class="btn-row">
      <button class="mode-btn active" id="btn-3d">3D</button>
      <button class="mode-btn" id="btn-2d">2D</button>
      <button class="mode-btn" id="btn-cv">CV</button>
    </div>
  </div>

  <div class="sb-block">
    <div class="sb-label">BASEMAP</div>
    <select id="basemap-sel" class="sb-sel">
      <option value="dark">Dark Tile</option>
      <option value="satellite">Satellite</option>
      <option value="terrain">Terrain</option>
      <option value="void">Void</option>
    </select>
  </div>

  <div class="sb-block">
    <div class="sb-label">SATELLITE GROUPS</div>
    <label class="chk"><input type="checkbox" checked data-satgrp="visual"> Visual (~150)</label>
    <label class="chk"><input type="checkbox" data-satgrp="space-stations"> Stations</label>
    <label class="chk"><input type="checkbox" data-satgrp="starlink"> Starlink</label>
    <label class="chk"><input type="checkbox" data-satgrp="weather"> Weather</label>
    <label class="chk"><input type="checkbox" data-satgrp="gps"> GPS/GNSS</label>
    <label class="chk"><input type="checkbox" data-satgrp="geo"> GEO Belt</label>
    <button class="sb-btn mt4" id="reload-sats">↺ RELOAD TLE</button>
  </div>

  <div class="sb-block">
    <div class="sb-label">SHODAN</div>
    <input type="password" id="shodan-key" class="sb-input" placeholder="API key">
    <select id="shodan-preset" class="sb-sel mt4">
      <option value="">Preset query…</option>
      <option value="has_screenshot:true product:webcam">IP Cameras</option>
      <option value="port:102 product:S7">SCADA/S7</option>
      <option value="tag:ics">Industrial Control</option>
      <option value="port:3389 os:Windows">Exposed RDP</option>
      <option value="authentication disabled port:5900">VNC No Auth</option>
      <option value="port:30003 dump1090">ADS-B Receivers</option>
      <option value="SolarEdge tag:iot">Solar Inverters</option>
    </select>
    <button class="sb-btn mt4" id="shodan-go">⌕ SEARCH</button>
  </div>

  <div class="sb-block">
    <div class="sb-label">TRACK PLAYBACK</div>
    <div id="pb-status" class="mono dim tiny">Querying archive…</div>
    <input type="range" id="pb-slider" min="0" max="100" value="100" class="slider">
    <div id="pb-time" class="mono amber tiny">● LIVE</div>
  </div>

  <div class="sb-block">
    <div class="sb-label">DEBUG</div>
    <button class="sb-btn" id="btn-debug">CHECK SOURCES</button>
    <div id="debug-out" class="mono tiny dim mt4"></div>
  </div>
</div>

<!-- INTEL PANEL (right) -->
<div id="intel-panel">
  <div class="panel-hdr">
    <div class="panel-hdr-left">
      <span class="panel-icon">◈</span>
      <span class="panel-title">INTELLIGENCE FEED</span>
    </div>
    <div class="panel-hdr-right">
      <span id="intel-src-badge" class="badge">GDELT · 100+ LANG</span>
      <button class="icon-btn" id="intel-close">✕</button>
    </div>
  </div>

  <div id="intel-search">
    <input type="text" id="intel-q" class="intel-input" placeholder="Search all global media in English…">
    <select id="intel-span" class="intel-sel">
      <option value="1h">1h</option>
      <option value="6h">6h</option>
      <option value="12h">12h</option>
      <option value="24h" selected>24h</option>
      <option value="7d">7d</option>
    </select>
    <button id="intel-go" class="intel-btn">⌕</button>
  </div>

  <div id="intel-filters">
    <button class="ftag active" data-q="">ALL</button>
    <button class="ftag" data-q="conflict OR attack OR war">CONFLICT</button>
    <button class="ftag" data-q="military OR troops OR airstrike">MILITARY</button>
    <button class="ftag" data-q="protest OR riot OR demonstration">PROTEST</button>
    <button class="ftag" data-q="earthquake OR flood OR disaster OR hurricane">DISASTER</button>
    <button class="ftag" data-q="cyber OR hack OR malware OR breach">CYBER</button>
    <button class="ftag" data-q="nuclear OR chemical OR biological OR weapons">WMD</button>
  </div>

  <div id="intel-items"></div>

  <div id="intel-footer">
    <span id="intel-count" class="mono dim tiny">—</span>
    <span class="dim tiny"> · GDELT updates every 15min</span>
    <button id="intel-refresh" class="tiny-btn">↺ REFRESH</button>
  </div>
</div>

<!-- AI QUERY -->
<div id="ai-bar">
  <div class="ai-prefix">◈ ARGUS AI</div>
  <input type="text" id="ai-in" placeholder="Natural language query… (e.g. 'What's happening over the Mediterranean?')">
  <button id="ai-send">ASK</button>
</div>

<div id="ai-response" class="hidden">
  <div class="air-hdr">
    <span>◈ INTELLIGENCE BRIEF</span>
    <button id="ai-dismiss">✕</button>
  </div>
  <div id="ai-text"></div>
</div>

<!-- ENTITY INFO -->
<div id="info-box" class="hidden">
  <div id="info-hdr">
    <span id="info-icon">●</span>
    <span id="info-name">Entity</span>
    <button id="info-close">✕</button>
  </div>
  <div id="info-body"></div>
  <div id="info-actions">
    <button class="act-btn" id="info-track">📍 TRACK</button>
    <button class="act-btn" id="info-shodan">🔍 SHODAN</button>
  </div>
</div>

<!-- TOASTS -->
<div id="toasts"></div>

<!-- LOG -->
<div id="log-wrap">
  <div id="log-hdr" onclick="toggleLog()">
    <span id="log-arrow">▶</span> SYSTEM LOG
    <span id="log-dot" class="dot green" style="margin-left:6px"></span>
  </div>
  <div id="log-body"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
