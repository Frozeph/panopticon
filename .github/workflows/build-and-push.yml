name: Build & Push to GHCR

on:
  push:
    branches: [main, master]
  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # This automatically becomes ghcr.io/<your-github-username>/panopticon
  IMAGE_NAME: ${{ github.repository_owner }}/panopticon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag main/master branch as 'latest'
            type=raw,value=latest,enable={{is_default_branch}}
            # Also tag with short git SHA for rollbacks
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GHCR to speed up future builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Build for amd64 only (ZimaBoard 2 = Intel N150)
          platforms: linux/amd64

      - name: Output image digest
        run: |
          echo "✅ Image pushed:"
          echo "   ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "   Digest: ${{ steps.build-and-push.outputs.digest }}"
