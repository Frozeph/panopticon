# ─────────────────────────────────────────────────────────────────────────────
# PANOPTICON // ZimaOS — Build From Source
# Use this if you don't have a pre-built image on a registry.
#
# SSH into ZimaBoard, clone the repo, then:
#   docker compose -f docker-compose.zimaos.build.yml up -d --build
#
# First build takes ~3-5 minutes (compiling better-sqlite3 native module)
# Subsequent starts are instant.
# ─────────────────────────────────────────────────────────────────────────────

name: panopticon

services:
  panopticon:
    build:
      context: .
      dockerfile: Dockerfile
      # Cache build layers for faster rebuilds
      cache_from:
        - type=local,src=/tmp/panopticon-build-cache
    image: panopticon:local
    container_name: panopticon
    restart: unless-stopped

    ports:
      - target: 3000
        published: "3000"
        protocol: tcp

    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - SHODAN_API_KEY=

    volumes:
      - type: bind
        source: /DATA/AppData/panopticon/data
        target: /app/data

    cpu_shares: 90
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    security_opt:
      - no-new-privileges=true
    privileged: false
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    network_mode: bridge

    labels:
      icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f30d.svg

x-casaos:
  author: self
  category: Network
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f30d.svg
  index: /
  is_uncontrolled: false
  port_map: "3000"
  scheme: http
  store_app_id: panopticon
  title:
    custom: PANOPTICON
    en_us: Panopticon — Global Intelligence Dashboard
